name: running_signals
version: "1.0.0"
config-version: 2

profile: running_signals

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  analytics_time_zone: "Europe/Amsterdam"
  aerobic_decoupling_moving_speed_threshold_mps: 0.5
  aerobic_decoupling_minimum_moving_duration_seconds: 1200
  aerobic_decoupling_minimum_moving_distance_m: 5000
  aerobic_decoupling_minimum_valid_segments: 8
  aerobic_decoupling_minimum_hr_coverage_ratio: 0.8
  aerobic_decoupling_maximum_hr_gap_seconds: 30

models:
  running_signals:
    silver:
      +materialized: view
      +schema: "{{ env_var('DATABRICKS_SILVER_SCHEMA', 'silver') }}"
    gold:
      +materialized: table
      +schema: "{{ env_var('DATABRICKS_GOLD_SCHEMA', 'gold') }}"
